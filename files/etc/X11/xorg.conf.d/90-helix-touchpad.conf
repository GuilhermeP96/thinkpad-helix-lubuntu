# ThinkPad Helix: tap to click; keep palm rejection while typing.
Section "InputClass"
    Identifier "Helix Synaptics touchpad"
    MatchProduct "Synaptics TM2219-002|SynPS/2 Synaptics TouchPad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "DisableWhileTyping" "on"
    Option "ScrollMethod" "twofinger"
    Option "NaturalScrolling" "true"
    Option "ScrollingPixelDistance" "10"
    Option "ClickMethod" "clickfinger"
EndSection
